name: AI Worker CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - "service/**"
      - ".github/workflows/ai-worker-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "service/**"
      - ".github/workflows/ai-worker-ci.yml"
  workflow_dispatch:

concurrency:
  group: ai-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run AI worker tests
        run: |
          pytest -q \
            tests/test_rule_engine.py \
            tests/test_units.py \
            tests/test_units_rules.py \
            tests/test_scenarios.py

  ai-docker-build:
    runs-on: ubuntu-latest
    needs: ai-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build AI worker image
        run: |
          docker build -f service/Dockerfile -t moodot-ai-worker:ci .

  ai-ecr-push:
    runs-on: ubuntu-latest
    needs: ai-docker-build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.3
      - name: Build and tag AI worker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          BRANCH_TAG: ${{ github.ref_name }}
        run: |
          docker build -f service/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH_TAG \
            .
      - name: Push AI worker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          BRANCH_TAG: ${{ github.ref_name }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH_TAG
