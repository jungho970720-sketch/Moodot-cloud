name: AI Worker CI

on:
  push:
    branches: [main, develop]
    paths:
      - "service/**"
      - ".github/workflows/ai-worker-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "service/**"
      - ".github/workflows/ai-worker-ci.yml"
  workflow_dispatch:

concurrency:
  group: ai-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run AI worker tests
        run: pytest -q

  ai-image-placeholder:
    runs-on: ubuntu-latest
    needs: ai-tests
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Explain deploy gate
        run: |
          echo "AI worker workflow is isolated to service/** changes."
          echo "Add ECR/ECS deploy steps here when infra secrets are ready."
